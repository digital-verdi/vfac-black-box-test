name: Deploy Varde Flyt resources

# The permanent, declarative pipeline. It applies the committed manifests on
# every push to main, secret-less, and never touches Entra, never creates an app
# and never rotates a secret. First creation (which carries a product secret) is
# a separate, temporary bootstrap.
#
#   VFAC_ENDPOINT / VFAC_CREDENTIAL_ID / VFAC_PROJECT_ID  repo variables
#   VFAC_CREDENTIAL_SECRET                                repo secret (step-scoped)
#
# RESOURCES is the ordered list of product ids to deploy, in dependency order.
# Rute and Frende are added here only after the bootstrap has been verified.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: varde-flyt-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VFAC_ENDPOINT: ${{ vars.VFAC_ENDPOINT }}
      VFAC_CREDENTIAL_ID: ${{ vars.VFAC_CREDENTIAL_ID }}
      VFAC_PROJECT_ID: ${{ vars.VFAC_PROJECT_ID }}
      ADMIN_EMAIL: ${{ vars.INITIAL_EMAIL_ADDRESS }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ vars.TARGET_ENTRA_APP_ID }}
      RESOURCES: "identity-sso rute-ai-gateway frende-ai-chat"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install vfac
        run: npm install --global @varde-flyt/vfac

      # The write Gate secret is scoped to the step that authenticates, and only
      # to it — never to the job.
      - name: validate -> plan -> apply (ordered, secret-less)
        env:
          VFAC_CREDENTIAL_SECRET: ${{ secrets.VFAC_CREDENTIAL_SECRET }}
        run: bash .github/scripts/deploy.sh
