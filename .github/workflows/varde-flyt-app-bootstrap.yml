name: Rute + Frende bootstrap (temporary)

# TEMPORARY, manually started. First creation of Rute and Frende, which needs
# their product secrets. Removed once the bootstrap is verified; afterwards the
# permanent, secret-less varde-flyt-deploy.yml keeps them converged.
#
# Frende reaches Rute purely by Resource-output references (serviceUrl,
# serviceApiKey) — no API key is created or copied by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: varde-flyt-app-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VFAC_ENDPOINT: ${{ vars.VFAC_ENDPOINT }}
      VFAC_CREDENTIAL_ID: ${{ vars.VFAC_CREDENTIAL_ID }}
      VFAC_PROJECT_ID: ${{ vars.VFAC_PROJECT_ID }}
      ADMIN_EMAIL: ${{ vars.INITIAL_EMAIL_ADDRESS }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ vars.TARGET_ENTRA_APP_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install vfac
        run: npm install --global @varde-flyt/vfac

      - name: Bootstrap Rute then Frende
        env:
          VFAC_CREDENTIAL_SECRET: ${{ secrets.VFAC_CREDENTIAL_SECRET }}
          OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: bash .github/scripts/app-bootstrap.sh
